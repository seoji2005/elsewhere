<title>골목 가게 그래픽 콘셉트</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
:root{
  --bg:#f4efe6; --surface:#fffaf2; --ink:#231f2e; --muted:#5d566b; --line:#ddd2c2;
  --accent:#c9572c; --chip:#efe3d0;
  --font:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16151f; --surface:#211f2c; --ink:#efe9df; --muted:#aaa2b6; --line:#36334a;
    --accent:#f0905c; --chip:#2c2a3b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16151f; --surface:#211f2c; --ink:#efe9df; --muted:#aaa2b6; --line:#36334a;
  --accent:#f0905c; --chip:#2c2a3b; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;
  padding-inline:max(16px,env(safe-area-inset-left));padding-block:10px 40px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 8px}
h1{font-size:1.05rem;margin:0;font-weight:700}
header p{margin:0;color:var(--muted);font-size:.82rem}
figure{margin:0 0 28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
figure>svg{display:block;width:100%;max-width:100%;height:auto;margin:0 auto;
  max-height:calc(100svh - 64px)}
figure svg text{font-family:var(--font)}
figcaption{padding:10px 14px 14px}
figcaption h2{font-size:1rem;margin:0 0 4px;display:flex;gap:8px;align-items:center}
figcaption h2 span{font-size:.75rem;background:var(--chip);color:var(--accent);border-radius:99px;padding:1px 9px}
figcaption p{margin:0;color:var(--muted);font-size:.9rem}
footer{color:var(--muted);font-size:.8rem;text-align:center}
</style>
