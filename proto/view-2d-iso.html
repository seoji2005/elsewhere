<title>골목 가게 2D 시제품</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe6d8;
  --bg2:#e4d6c2;
  --panel:rgba(255,250,242,.94);
  --ink:#3a2a20;
  --muted:#7a6656;
  --line:rgba(58,42,32,.16);
  --accent:#e0703a;
  --accent-ink:#ffffff;
  --accent-deep:#b9542a;
  --good:#2f8f5b;
  --shadow:0 4px 14px rgba(40,24,10,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1613; --bg2:#2a201b; --panel:rgba(44,34,29,.94); --ink:#f4e8da; --muted:#bba48f;
    --line:rgba(244,232,218,.16); --accent:#f08a4b; --accent-ink:#1c1613; --accent-deep:#c8642e;
    --good:#6fd39a; --shadow:0 4px 14px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1613; --bg2:#2a201b; --panel:rgba(44,34,29,.94); --ink:#f4e8da; --muted:#bba48f;
  --line:rgba(244,232,218,.16); --accent:#f08a4b; --accent-ink:#1c1613; --accent-deep:#c8642e;
  --good:#6fd39a; --shadow:0 4px 14px rgba(0,0,0,.45);
}
html,body{margin:0;height:100%;overflow:hidden;}
body{
  background:radial-gradient(ellipse at 50% 55%,var(--bg) 0%,var(--bg2) 100%) var(--bg);
  color:var(--ink);font-family:'Jua',system-ui,-apple-system,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
button{font-family:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
#top{
  position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;
  padding:8px max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));
  padding-top:max(8px,env(safe-area-inset-top));pointer-events:none;
}
.chip{
  background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
  padding:6px 12px;font-size:16px;line-height:20px;white-space:nowrap;pointer-events:auto;
}
.chip b{font-weight:400;color:var(--muted);font-size:13px;margin-right:4px}
#money{color:var(--good);transition:transform .15s}
#money.bump{transform:scale(1.15)}
#guide{
  flex:1;min-width:0;text-align:center;font-size:15px;line-height:20px;padding:6px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#guide.flash{animation:fl .5s}
@keyframes fl{0%{transform:scale(1.04);background:var(--accent);color:var(--accent-ink)}100%{transform:scale(1)}}
#decorBtn{
  pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
  padding:6px 14px;font-size:16px;line-height:20px;min-height:34px;white-space:nowrap;
}
#decorBtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#decorPanel{
  position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
}
#decorPanel[hidden]{display:none}
#decorPanel button{
  min-width:76px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font-size:17px;padding:4px 12px;display:flex;align-items:center;gap:6px;justify-content:center;
}
#decorPanel button i{width:14px;height:14px;border-radius:4px;display:inline-block}
#decorPanel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#decorPanel #decorDone{background:var(--ink);color:var(--bg)}
#pay{
  position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));
  width:108px;height:108px;border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,#ffb27a 0%,var(--accent) 45%,var(--accent-deep) 100%);
  color:#fff;box-shadow:0 8px 20px rgba(120,50,10,.35),inset 0 -5px 0 rgba(0,0,0,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transform:scale(0);opacity:0;transition:transform .22s cubic-bezier(.3,1.6,.5,1),opacity .15s;pointer-events:none;
}
#pay.show{transform:scale(1);opacity:1;pointer-events:auto}
#pay.show:active{transform:scale(.93)}
#pay span{font-size:30px;line-height:32px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
#pay small{font-size:14px;opacity:.95}
#dbg{
  position:fixed;left:max(8px,env(safe-area-inset-left));bottom:4px;font:11px/1.3 ui-monospace,monospace;
  color:var(--muted);pointer-events:none;
}
@media (max-width:620px){
  #top{flex-wrap:wrap}
  #guide{order:5;flex-basis:100%}
  #decorBtn{margin-left:auto}
  #decorPanel{flex-direction:row;flex-wrap:wrap;right:140px}
  #decorPanel button{min-width:0;flex:1}
}
</style>

<canvas id="cv" aria-label="골목 가게 실내 — 바닥과 물건을 탭해서 조작"></canvas>
<div id="top">
  <div class="chip" id="clock"><b>시각</b>17:00</div>
  <div class="chip" id="money"><b>돈</b>₩0</div>
  <div id="guide" role="status" aria-live="polite">상자를 진열대로 옮겨 보세요</div>
  <button id="decorBtn" aria-pressed="false">꾸미기</button>
</div>
<div id="decorPanel" hidden>
  <button data-t="pot" aria-pressed="false"><i style="background:#5ba35c"></i>화분</button>
  <button data-t="chair" aria-pressed="false"><i style="background:#b07a4c"></i>의자</button>
  <button data-t="lamp" aria-pressed="false"><i style="background:#f6c86a"></i>등불</button>
  <button id="decorDone">완료</button>
</div>
<button id="pay" aria-label="계산하기"><span>계산</span><small id="payAmt"></small></button>
<div id="dbg" hidden></div>

<script>
(() => {
'use strict';
// ───────── 설정 ─────────
const W = 9, H = 7, TW = 64, TH = 32, WALLH = 104, SHELF_H = 70, CAP = 8, PER_BOX = 4, MAX_CUST = 4, MAX_DECOR = 6;
const DEBUG = /[?&]debug=1/.test(location.search);
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const bg = document.createElement('canvas'), bctx = bg.getContext('2d');
const $ = id => document.getElementById(id);
const iso = (x, y) => [(x - y) * TW / 2, (x + y) * TH / 2];
const up = (p, h) => [p[0], p[1] - h];
const key = (x, y) => x + ',' + y;
const rnd = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const won = n => '₩' + n.toLocaleString('ko-KR');

// ───────── 가게 배치 ─────────
const shelves = [
  { name: '빵', goods: 'bread', price: 3500, tiles: [[4, 1], [4, 2]], face: 'x', stock: 3, flash: 0 },
  { name: '우유', goods: 'milk', price: 2800, tiles: [[6, 1], [6, 2]], face: 'x', stock: 0, flash: 0 },
  { name: '과자', goods: 'snack', price: 1500, tiles: [[6, 5], [7, 5]], face: 'y', stock: 2, flash: 0, low: true },
];
shelves.forEach(s => { s.browse = s.tiles.map(([x, y]) => s.face === 'x' ? [x + 1, y] : [x, y + 1]); });
const COUNTER = [[1, 4], [1, 5]];
const PILE = [0, 1];
const CASHIER = [0, 4], ENTRY = [7, 0], OUTSIDE = [7, -1];
const QUEUE = [[2, 4], [3, 4], [4, 4], [5, 4]];
const STAFF = new Set([key(0, 4), key(0, 5)]);
const RESERVED = new Set([key(...ENTRY), key(...CASHIER), key(0, 5), ...QUEUE.map(q => key(...q))]);
const staticBlock = new Set();
shelves.forEach(s => s.tiles.forEach(t => staticBlock.add(key(...t))));
COUNTER.forEach(t => staticBlock.add(key(...t)));
staticBlock.add(key(...PILE));
const decor = [];
const decorAt = (x, y) => decor.find(d => d.x === x && d.y === y);

function walkable(x, y, who) {
  if (x < 0 || y < 0 || x >= W || y >= H) return false;
  const k = key(x, y);
  if (staticBlock.has(k) || decorAt(x, y)) return false;
  if (who === 'cust' && STAFF.has(k)) return false;
  return true;
}
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function bfs(sx, sy, goal, who) {
  if (goal(sx, sy)) return [];
  const prev = new Map([[key(sx, sy), null]]);
  const q = [[sx, sy]];
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy, k = key(nx, ny);
      if (prev.has(k) || !walkable(nx, ny, who)) continue;
      prev.set(k, [x, y]);
      if (goal(nx, ny)) {
        const path = [[nx, ny]];
        let p = [x, y];
        while (p && !(p[0] === sx && p[1] === sy)) { path.unshift(p); p = prev.get(key(...p)); }
        return path;
      }
      q.push([nx, ny]);
    }
  }
  return null;
}
function flood(s, who) {
  const seen = new Set([key(...s)]), q = [s];
  for (let i = 0; i < q.length; i++) for (const [dx, dy] of DIRS) {
    const nx = q[i][0] + dx, ny = q[i][1] + dy, k = key(nx, ny);
    if (!seen.has(k) && walkable(nx, ny, who)) { seen.add(k); q.push([nx, ny]); }
  }
  return seen;
}
const adj = (t) => DIRS.map(([dx, dy]) => [t[0] + dx, t[1] + dy]);
const isAdjTo = tiles => (x, y) => tiles.some(([a, b]) => Math.abs(a - x) + Math.abs(b - y) === 1);

// ───────── 사람 ─────────
const LOOKS = [
  { shirt: '#e07a5f', pants: '#4a4e69', hair: '#2b1d16', skin: '#f1c9a5' },
  { shirt: '#81b29a', pants: '#3d405b', hair: '#6b4a2f', skin: '#e8b98f', long: true },
  { shirt: '#f2cc8f', pants: '#5a4636', hair: '#c9c4bd', skin: '#f3d0b0' },
  { shirt: '#9b6fb5', pants: '#2f3242', hair: '#3b2a22', skin: '#f1c9a5', hat: '#e05a47' },
  { shirt: '#4f86c6', pants: '#e6dccb', hair: '#8a3b2e', skin: '#ecc19c', long: true },
  { shirt: '#d4a373', pants: '#344e41', hair: '#1f1f1f', skin: '#d9a77f', hat: '#2f6f73' },
];
function makeChar(o) {
  return Object.assign({ x: 0, y: 0, path: [], speed: 2.1, phase: 0, facing: 1, back: false, alpha: 1, moving: false,
    bubble: null, mood: null, moodT: 0, goalFn: null, who: 'cust', reach: 0 }, o);
}
const owner = makeChar({ x: 2, y: 3, speed: 3.3, who: 'owner', isOwner: true, carrying: false, task: null,
  look: { shirt: '#3c6e8f', pants: '#34343f', hair: '#2b1d16', skin: '#f0c7a2', apron: '#f4efe6', band: '#d94b3a' } });
let custs = [];
const queue = [];

const curTile = c => c.path.length ? c.path[0] : [Math.round(c.x), Math.round(c.y)];
function goTo(c, goalFn) {
  const s = curTile(c);
  const p = bfs(s[0], s[1], goalFn, c.who);
  if (p === null) return false;
  c.goalFn = goalFn;
  c.path = (c.path.length ? [c.path[0]] : []).concat(p);
  return true;
}
const exact = t => (x, y) => x === t[0] && y === t[1];
function setDir(c, dx, dy) {
  const sx = dx - dy, sy = dx + dy;
  if (Math.abs(sx) > 1e-3) c.facing = sx > 0 ? 1 : -1;
  if (Math.abs(sy) > 1e-3) c.back = sy < 0;
}
function stepChar(c, dt) {
  if (!c.path.length) { c.moving = false; return false; }
  const [tx, ty] = c.path[0];
  const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
  const sp = c.speed * (c.carrying ? 0.62 : 1) * dt;
  if (d > 1e-4) setDir(c, dx, dy);
  c.moving = true; c.phase += dt * (c.carrying ? 7 : 10.5);
  if (d <= sp) {
    c.x = tx; c.y = ty; c.path.shift();
    if (!c.path.length) { c.moving = false; c.goalFn = null; return true; }
  } else { c.x += dx / d * sp; c.y += dy / d * sp; }
  return false;
}
function say(c, text, dur = 2.4, kind) { c.bubble = { text, t: 0, dur, kind }; }

// ───────── 상태 ─────────
let money = 0, elapsed = 0, spawnT = 2.5, custCount = 0;
let didPick = false, didStock = false, didPay = false, didDecor = false;
let decorMode = false, selType = null, toastMsg = null, toastT = 0;
const fx = [];
let routes = null;

// ───────── 소리 ─────────
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type = 'sine', vol = .2, delay = 0, slide = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .05);
}
const sfx = {
  ding() { tone(1568, 1.2, 'sine', .22); tone(3136, .5, 'sine', .05); tone(2093, 1.4, 'sine', .2, .1); tone(4186, .4, 'sine', .04, .1); },
  pick() { tone(240, .13, 'triangle', .16, 0, 1.7); },
  stock() { tone(520, .07, 'triangle', .12); tone(660, .07, 'triangle', .12, .07); tone(880, .1, 'triangle', .12, .14); },
  place() { tone(170, .16, 'triangle', .2, 0, .6); tone(600, .06, 'square', .03, .03); },
  bell() { tone(1046, .5, 'sine', .06); tone(1318, .7, 'sine', .05, .13); },
  sad() { tone(392, .3, 'triangle', .07, 0, .75); },
  tap() { tone(900, .035, 'sine', .035); },
  nope() { tone(200, .12, 'square', .04); },
};

// ───────── 화면 맞춤 ─────────
let dpr = 1, sc = 1, ox = 0, oy = 0, vw = 0, vh = 0;
const WX0 = -H * TW / 2 - 16, WX1 = W * TW / 2 + 16, WY0 = -WALLH - 34, WY1 = (W + H) * TH / 2 + 18;
function fit() {
  vw = window.innerWidth; vh = window.innerHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = bg.width = Math.round(vw * dpr);
  cv.height = bg.height = Math.round(vh * dpr);
  const topB = $('top').getBoundingClientRect().bottom + 4;
  const portrait = vh > vw;
  const botR = portrait ? 140 : 8;
  const aw = vw - (portrait ? 12 : 24), ah = vh - topB - botR;
  sc = Math.min(aw / (WX1 - WX0), ah / (WY1 - WY0), 2.2);
  ox = vw / 2 - (WX0 + WX1) / 2 * sc;
  oy = topB + ah / 2 - (WY0 + WY1) / 2 * sc;
  renderBg();
}
const toScreen = (X, Y) => [ox + X * sc, oy + Y * sc];

// ───────── 그리기 도우미 ─────────
function poly(g, pts, fill, stroke, lw) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1; g.stroke(); }
}
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function ell(g, x, y, rx, ry, fill) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
function prism(g, gx, gy, w, d, h, lift, top, left, right) {
  const A = up(iso(gx, gy), lift), B = up(iso(gx + w, gy), lift), C = up(iso(gx + w, gy + d), lift), D = up(iso(gx, gy + d), lift);
  poly(g, [D, C, up(C, h), up(D, h)], left);
  poly(g, [B, C, up(C, h), up(B, h)], right);
  poly(g, [up(A, h), up(B, h), up(C, h), up(D, h)], top);
}
function hexHit(X, Y, gx, gy, w, d, h) {
  const A = iso(gx, gy), B = iso(gx + w, gy), C = iso(gx + w, gy + d), D = iso(gx, gy + d);
  const P = [up(A, h), up(B, h), B, C, D, up(D, h)];
  let sign = 0;
  for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i + 1) % P.length];
    const cr = (b[0] - a[0]) * (Y - a[1]) - (b[1] - a[1]) * (X - a[0]);
    if (Math.abs(cr) < 1e-9) continue;
    const s = cr > 0 ? 1 : -1;
    if (!sign) sign = s; else if (s !== sign) return false;
  }
  return true;
}
const BP = (u, h) => [u * TW / 2, u * TH / 2 - h];        // 뒷벽(y=0) 위의 점
const LP = (v, h) => [-v * TW / 2, v * TH / 2 - h];       // 왼벽(x=0) 위의 점
const wallQuad = (F, a, b, h0, h1) => [F(a, h0), F(b, h0), F(b, h1), F(a, h1)];

// ───────── 배경(바닥·벽) ─────────
function renderBg() {
  const g = bctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, bg.width, bg.height);
  g.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  // 디오라마 그림자 + 바닥판 두께
  const cc = iso(W / 2, H / 2);
  g.save(); g.globalAlpha = .22; ell(g, cc[0] + 8, cc[1] + 30, (W + H) * TW / 4 + 26, (W + H) * TH / 4 + 18, '#2a1608'); g.restore();
  const FT = 12;
  poly(g, [iso(0, H), iso(W, H), up(iso(W, H), -FT), up(iso(0, H), -FT)], '#6e4a32');
  poly(g, [iso(W, 0), iso(W, H), up(iso(W, H), -FT), up(iso(W, 0), -FT)], '#5a3b28');
  // 바닥 타일
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = ((x * 7 + y * 13) % 5) / 5;
    const base = (x + y) % 2 ? [201, 162, 122] : [214, 178, 138];
    const col = `rgb(${base[0] - v * 8 | 0},${base[1] - v * 8 | 0},${base[2] - v * 6 | 0})`;
    poly(g, [iso(x, y), iso(x + 1, y), iso(x + 1, y + 1), iso(x, y + 1)], col, 'rgba(120,80,50,.35)', .8);
    poly(g, [iso(x + .5, y + .08), iso(x + .92, y + .5), iso(x + .5, y + .5)], 'rgba(255,240,215,.10)');
  }
  // 문 앞 매트, 계산대 앞 러그
  poly(g, [iso(7.08, .06), iso(7.92, .06), iso(7.92, .9), iso(7.08, .9)], '#8a3b30');
  poly(g, [iso(7.18, .16), iso(7.82, .16), iso(7.82, .8), iso(7.18, .8)], null, 'rgba(255,220,180,.45)', 1.2);
  poly(g, [iso(2.1, 3.15), iso(5.9, 3.15), iso(5.9, 4.85), iso(2.1, 4.85)], 'rgba(70,110,120,.32)');
  poly(g, [iso(2.25, 3.3), iso(5.75, 3.3), iso(5.75, 4.7), iso(2.25, 4.7)], null, 'rgba(255,245,225,.35)', 1.2);
  // 창문 빛
  g.save(); g.globalCompositeOperation = 'lighter';
  poly(g, [iso(1.6, 0), iso(3.8, 0), iso(4.6, 2.6), iso(2.4, 2.6)], 'rgba(255,150,70,.13)');
  poly(g, [iso(7.1, 0), iso(7.9, 0), iso(8.3, 1.4), iso(7.5, 1.4)], 'rgba(255,150,70,.10)');
  g.restore();

  // 벽 두께(윗면)와 끝면
  const T = .22;

// ───────── 사람 그리기 ─────────
function drawPerson(g, c, tm) {
  const [px, by] = iso(c.x + .5, c.y + .5);
  const L = c.look, f = c.facing, back = c.back;
  const sw = c.moving ? Math.sin(c.phase) : 0;

  const lean = c.reach > 0 ? f * 1.5 : 0;
  g.save(); g.globalAlpha = c.alpha;
  ell(g, px, by, 10.5, 4.6, 'rgba(40,20,10,.26)');
  const y = by - bob - jump;
  // 다리
  g.fillStyle = L.pants;
  rr(g, px - 5.6, y - 13 - Math.max(0, sw) * 2.6, 4.6, 13, 2); g.fill();
  rr(g, px + 1, y - 13 - Math.max(0, -sw) * 2.6, 4.6, 13, 2); g.fill();
  g.fillStyle = '#2a2220';
  rr(g, px - 6, y - 2.5 - Math.max(0, sw) * 2.6, 5.4, 3, 1.2); g.fill();
  rr(g, px + .6, y - 2.5 - Math.max(0, -sw) * 2.6, 5.4, 3, 1.2); g.fill();
  // 몸통
  const bx = px + lean;

  if (L.apron && !back) {
    rr(g, bx - 6 + f, y - 26 + sag, 12, 16, 3); g.fillStyle = L.apron; g.fill();
    g.fillStyle = '#d94b3a'; g.fillRect(bx - 2 + f, y - 21 + sag, 4, 1.5);
  } else if (L.apron) {
    g.strokeStyle = L.apron; g.lineWidth = 1.6; g.beginPath(); g.moveTo(bx - 8, y - 18 + sag); g.lineTo(bx + 8, y - 18 + sag); g.stroke();
  }
  // 팔
  const sk = L.skin;
  if (c.carrying) {
    g.fillStyle = L.shirt;
    rr(g, bx - 11.5, y - 50, 4, 22, 2); g.fill(); rr(g, bx + 7.5, y - 50, 4, 22, 2); g.fill();
  } else if (c.reach > 0) {
    const ex = bx + f * (14 + Math.sin(tm * 6) * 1.5), ey = y - 29 + sag;
    g.strokeStyle = L.shirt; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(bx + f * 6, y - 26 + sag); g.lineTo(ex, ey); g.stroke();
    ell(g, ex, ey, 2.4, 2.4, sk);
    g.fillStyle = L.shirt; rr(g, bx - f * 10.5 - 2, y - 28 + sag, 4, 13, 2); g.fill();
  } else {
    g.fillStyle = L.shirt;
    rr(g, bx - 11.5, y - 28 + sag + sw * 1.6, 4, 14, 2); g.fill();
    rr(g, bx + 7.5, y - 28 + sag - sw * 1.6, 4, 14, 2); g.fill();
    ell(g, bx - 9.5, y - 14 + sag + sw * 1.6, 2.2, 2.2, sk);
    ell(g, bx + 9.5, y - 14 + sag - sw * 1.6, 2.2, 2.2, sk);
    if (c.item) { const ix = bx + f * 10, iy = y - 9 + sag - f * sw * 1.6; g.save(); g.translate(ix, iy); g.scale(.75, .75); drawItem(g, c.item.goods, 0, 0, c.id || 0); g.restore(); }
  }
  // 머리
  const hx = bx + (c.reach > 0 ? f * 1.5 : 0), hy = y - 40 + sag;
  ell(g, hx, hy, 8.6, 8.6, sk);
  if (back) {
    ell(g, hx, hy - .5, 9.2, 9.2, L.hair);
    if (L.long) ell(g, hx, hy + 5, 8, 7, L.hair);
  } else {
    g.beginPath(); g.arc(hx, hy - .5, 9.2, Math.PI * 1.02, Math.PI * 1.98); g.closePath(); g.fillStyle = L.hair; g.fill();
    ell(g, hx - f * 5.5, hy - .5, 4.5, 7, L.hair);
    if (L.long) ell(g, hx - f * 5, hy + 5, 4.5, 8, L.hair);
    // 얼굴
    const ex = hx + f * 2.2, eyY = hy + 1.5;
    g.fillStyle = '#2a1d18'; g.strokeStyle = '#2a1d18'; g.lineWidth = 1.2; g.lineCap = 'round';
    if (c.mood === 'happy') {
      for (const o of [-2.8, 2.8]) { g.beginPath(); g.arc(ex + o, eyY + .8, 1.6, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
    } else if (c.mood === 'sad' || c.mood === 'angry') {
      for (const o of [-2.8, 2.8]) { g.beginPath(); g.moveTo(ex + o - 1.4, eyY + (c.mood === 'angry' ? -o * .25 : o * .2) - .5); g.lineTo(ex + o + 1.4, eyY + (c.mood === 'angry' ? o * .25 : -o * .2) - .5); g.stroke(); }
    } else {
      const blink = (tm * 1000 + (c.id || 0) * 777) % 3200 < 120;
      for (const o of [-2.8, 2.8]) blink ? g.fillRect(ex + o - 1.2, eyY, 2.4, .9) : ell(g, ex + o, eyY, 1.15, 1.5, '#2a1d18');
    }
    ell(g, ex - 5, eyY + 3, 1.8, 1.1, 'rgba(240,120,110,.4)'); ell(g, ex + 5, eyY + 3, 1.8, 1.1, 'rgba(240,120,110,.4)');
    g.beginPath();
    if (c.mood === 'happy') g.arc(ex, eyY + 3.2, 2, Math.PI * .1, Math.PI * .9);
    else if (c.mood === 'sad' || c.mood === 'angry') g.arc(ex, eyY + 6, 1.8, Math.PI * 1.15, Math.PI * 1.85);
    else { g.moveTo(ex - 1.2, eyY + 4.3); g.lineTo(ex + 1.2, eyY + 4.3); }
    g.stroke();
  }
  if (L.band) { g.strokeStyle = L.band; g.lineWidth = 2.6; g.beginPath(); g.arc(hx, hy - .5, 8.9, Math.PI * 1.08, Math.PI * 1.92); g.stroke();
    if (!back) { g.fillStyle = L.band; poly(g, [[hx - f * 8, hy - 4], [hx - f * 13, hy - 6], [hx - f * 12, hy - 1]], L.band); } }
  if (L.hat) { g.beginPath(); g.arc(hx, hy - 1.5, 9.6, Math.PI, 0); g.closePath(); g.fillStyle = L.hat; g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(hx - 9.6, hy - 3, 19.2, 2.2); ell(g, hx, hy - 11.5, 2.4, 2.4, L.hat); }
  // 든 상자
  if (c.carrying) {
    const cy = y - 52;
    poly(g, [[px, cy - 9], [px + 12, cy - 3], [px, cy + 3], [px - 12, cy - 3]], '#e8ba7c');
    poly(g, [[px - 12, cy - 3], [px, cy + 3], [px, cy + 13], [px - 12, cy + 7]], '#c08a4d');
    poly(g, [[px + 12, cy - 3], [px, cy + 3], [px, cy + 13], [px + 12, cy + 7]], '#a87542');
    g.strokeStyle = 'rgba(150,100,50,.8)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(px - 6, cy - 6); g.lineTo(px + 6, cy); g.stroke();
  }
  g.restore();
}

// ───────── 손님 ─────────
const GREET = ['늘 사던 거요', '안녕하세요~', '오늘 뭐 있나…', '{n} 있어요?'];
function spawnCustomer() {
  custCount++;

  const c = makeChar({ x: OUTSIDE[0], y: OUTSIDE[1], alpha: 0, speed: 1.9 + Math.random() * .4, look: LOOKS[(custCount * 5 + 1) % LOOKS.length],
    id: custCount, state: 'enter', want, wait: 0, said: {}, back: false, facing: -1 });
  c.path = [ENTRY.slice()];
  custs.push(c);

}
function pickShelf(c) {

  const taken = new Set(custs.filter(o => o !== c && o.spot).map(o => key(...o.spot)));
  const free = c.shelf.browse.filter(b => walkable(b[0], b[1], 'cust') && !taken.has(key(...b)));
  const opts = free.length ? free : c.shelf.browse.filter(b => walkable(b[0], b[1], 'cust'));
  const okFn = (x, y) => opts.some(b => b[0] === x && b[1] === y);
  if (!opts.length || !goTo(c, okFn)) { say(c, '못 지나가겠네…'); leave(c, 'sad'); return; }
  c.spot = c.path.length ? c.path[c.path.length - 1] : curTile(c);

}
function leave(c, mood) {
  if (mood) { c.mood = mood; c.moodT = 1.2; }
  const qi = queue.indexOf(c); if (qi >= 0) queue.splice(qi, 1);
  c.spot = null; c.reach = 0;
  c.state = 'leave';

}
function goQueue(c) {

}
function faceToward(c, tx, ty) { setDir(c, tx - Math.round(c.x), ty - Math.round(c.y)); }
function updateCust(c, dt) {

  switch (c.state) {
    case 'enter': if (arrived) pickShelf(c); break;
    case 'toShelf':
      if (arrived) {
        const t = c.shelf.tiles.find(([a, b]) => Math.abs(a - c.x) + Math.abs(b - c.y) === 1) || c.shelf.tiles[0];
        faceToward(c, t[0], t[1]);

        else { c.state = 'browse'; c.timer = 1.7 + Math.random() * .8; say(c, rnd(['음…', '어디 보자', '이거다!']), 1.4, 'think'); }

      if (c.state === 'toQueue' && !c.path.length) c.state = 'queued';
      if (c.state === 'queued' && !c.moving) { c.facing = -1; c.back = true; }
      c.wait += dt;

// ───────── 사장 ─────────
function ownerAtCashier() { return !owner.path.length && Math.round(owner.x) === CASHIER[0] && Math.round(owner.y) === CASHIER[1]; }
function canPay() {
  const c = queue[0];
  return !!(c && c.state === 'queued' && !c.moving && c.slot === 0 && ownerAtCashier());
}
function ownerArrive() {
  const t = owner.task; owner.task = null;
  if (!t) return;
  if (t.type === 'pickup') {
    if (owner.carrying) { say(owner, '이미 들고 있어요', 1.4); return; }
    owner.carrying = true; didPick = true; sfx.pick(); say(owner, '영차!', 1.1);
    faceToward(owner, PILE[0], PILE[1]);
  } else if (t.type === 'stock') {
    const s = t.shelf;
    const near = s.tiles.find(([a, b]) => Math.abs(a - owner.x) + Math.abs(b - owner.y) === 1);
    if (near) faceToward(owner, near[0], near[1]);
    if (!owner.carrying) { say(owner, '상자부터 가져와야지', 1.8); return; }
    if (s.stock >= CAP) { say(owner, '꽉 찼네', 1.4); return; }
    s.stock = Math.min(CAP, s.stock + PER_BOX); s.flash = 1; owner.carrying = false; didStock = true;
    sfx.stock(); say(owner, s.name + ' 채웠다!', 1.3);
  } else if (t.type === 'cashier') {
    owner.facing = 1; owner.back = false;
  }
}
function command(task, goalFn) {
  owner.task = task;
  if (!goTo(owner, goalFn)) { owner.task = null; sfx.nope(); toast('그쪽으로는 갈 수 없어요'); return; }
  if (!owner.path.length) ownerArrive();
}

function pay() {
  if (!canPay()) return;
  audio();
  const c = queue.shift();
  const amt = c.item ? c.item.price : 0;
  money += amt; didPay = true;
  const m = $('money'); m.innerHTML = '<b>돈</b>' + won(money); m.classList.add('bump'); setTimeout(() => m.classList.remove('bump'), 160);
  fx.push({ type: 'money', wx: c.x + .5, wy: c.y + .5, t: 0, dur: 1.3, text: '+' + won(amt) });
  for (let i = 0; i < 4; i++) fx.push({ type: 'heart', wx: c.x + .5, wy: c.y + .5, t: -i * .12, dur: 1.1, dx: (i - 1.5) * 8 });
  sfx.ding();
  c.mood = 'happy'; c.moodT = 1.4; c.item = null;
  say(c, rnd(['고마워요!', '또 올게요~', '잘 먹을게요!']), 1.8);
  say(owner, '감사합니다~', 1.2);
  c.state = 'paid'; c.timer = .7;
}

// ───────── 꾸미기 ─────────
function reachOK() {
  const r = flood(ENTRY, 'cust');
  if (!QUEUE.every(q => r.has(key(...q)))) return false;
  if (!shelves.every(s => s.browse.some(b => r.has(key(...b))))) return false;
  const r2 = flood(curTile(owner), 'owner');
  if (!r2.has(key(...CASHIER)) || !adj(PILE).some(t => r2.has(key(...t)))) return false;
  for (const c of custs) { const t = curTile(c); if (t[1] >= 0 && !r.has(key(...t))) return false; }
  return true;
}
function occupied(x, y) {
  return [owner, ...custs].some(c => {
    const t = curTile(c);
    return (t[0] === x && t[1] === y) || (Math.round(c.x) === x && Math.round(c.y) === y);
  });
}
function canPlace(x, y) {
  if (x < 0 || y < 0 || x >= W || y >= H) return '바닥 칸을 탭하세요';
  if (staticBlock.has(key(x, y))) return '가구가 있는 칸이에요';
  if (RESERVED.has(key(x, y))) return '여기는 비워 둬야 해요(문·계산대 줄)';
  if (occupied(x, y)) return '사람이 서 있어요';

  return null;
}
function repathAll() {
  for (const c of [owner, ...custs]) if (c.goalFn) { const fn = c.goalFn; if (!goTo(c, fn)) c.path = c.path.slice(0, 1); }
  routes = null;
}
function decorTap(x, y) {
  const ex = decorAt(x, y);
  if (ex) { decor.splice(decor.indexOf(ex), 1); sfx.place(); repathAll(); toast('치웠어요'); return; }
  if (!selType) { toast('먼저 왼쪽에서 소품을 고르세요'); sfx.nope(); return; }
  const why = canPlace(x, y);
  if (why) { toast(why); sfx.nope(); return; }
  decor.push({ type: selType, x, y });
  if (!reachOK()) { decor.pop(); toast('길이 막혀요 — 다른 칸에 놓아 주세요'); sfx.nope(); return; }
  sfx.place(); didDecor = true; repathAll();
  fx.push({ type: 'ring', wx: x + .5, wy: y + .5, t: 0, dur: .5 });
  toast('손님 동선이 바뀌었어요 (점선)');
}
function computeRoutes() {
  const res = [];
  for (const s of shelves) {
    const p = bfs(ENTRY[0], ENTRY[1], (x, y) => s.browse.some(b => b[0] === x && b[1] === y), 'cust');
    if (!p) continue;
    const end = p.length ? p[p.length - 1] : ENTRY;
    const p2 = bfs(end[0], end[1], exact(QUEUE[0]), 'cust') || [];
    res.push([ENTRY, ...p, ...p2]);

}
function setDecorMode(on) {
  decorMode = on;
  $('decorBtn').setAttribute('aria-pressed', on);
  $('decorPanel').hidden = !on;
  if (!on) { selType = null; document.querySelectorAll('#decorPanel [data-t]').forEach(b => b.setAttribute('aria-pressed', 'false')); }
  routes = null;
}

// ───────── 안내 ─────────
function toast(t) { toastMsg = t; toastT = 1.8; }
function guide() {
  if (toastMsg && toastT > 0) return { text: toastMsg };
  if (decorMode) return { text: selType ? '바닥 칸을 탭해 놓기 · 놓인 소품을 탭하면 치워요' : '왼쪽에서 소품을 고르세요' };
  if (canPay()) return { text: '계산 버튼을 누르세요!' };
  if (owner.carrying) {
    const s = shelves.find(s => s.stock === 0) || shelves.reduce((a, b) => a.stock <= b.stock ? a : b);
    return { text: '진열대를 탭해 물건을 채우세요', target: shelfTop(s) };
  }
  if (queue.length && queue[0].state === 'queued' && !ownerAtCashier() && owner.task?.type !== 'cashier')
    return { text: '손님이 기다려요 — 계산대를 탭하세요', target: [...iso(1.5, 4.5), 50] };
  if (!didStock) return { text: '상자를 진열대로 옮겨 보세요 — 먼저 상자 더미를 탭', target: [...iso(.5, 1.5), 60] };
  if (shelves.some(s => s.stock === 0)) return { text: '빈 진열대가 있어요 — 상자를 채워 두세요', target: [...iso(.5, 1.5), 60] };
  if (didPay && !didDecor) return { text: "'꾸미기'로 소품을 놓아 손님 동선을 바꿔 보세요" };
  return { text: '손님을 맞이하세요 · 바닥을 탭하면 걸어가요' };
}
function shelfTop(s) {
  const [ax, ay] = s.tiles[0];
  return [...(s.face === 'x' ? iso(ax + .5, ay + 1) : iso(ax + 1, ay + .5)), s.low ? 40 : SHELF_H + 20];
}

// ───────── 입력 ─────────
function onTap(e) {
  audio();
  const r = cv.getBoundingClientRect();
  const X = (e.clientX - r.left - ox) / sc, Y = (e.clientY - r.top - oy) / sc;
  const gx = (X / (TW / 2) + Y / (TH / 2)) / 2, gy = (Y / (TH / 2) - X / (TW / 2)) / 2;
  const tx = Math.floor(gx), ty = Math.floor(gy);
  if (decorMode) { decorTap(tx, ty); return; }
  // 물건 판정(앞쪽부터)
  const hits = [];
  shelves.forEach(s => s.tiles.forEach(t => hits.push({ d: t[0] + t[1], h: s.low ? 44 : SHELF_H + 8, t, act: () => command({ type: 'stock', shelf: s }, isAdjTo(s.tiles)) })));
  COUNTER.forEach(t => hits.push({ d: t[0] + t[1], h: 50, t, act: () => command({ type: 'cashier' }, exact(CASHIER)) }));
  hits.push({ d: PILE[0] + PILE[1], h: 58, t: PILE, act: () => command({ type: 'pickup' }, isAdjTo([PILE])) });
  hits.sort((a, b) => b.d - a.d);
  for (const h of hits) if (hexHit(X, Y, h.t[0], h.t[1], 1, 1, h.h)) { sfx.tap(); ripple(h.t[0], h.t[1]); h.act(); return; }
  if (tx < 0 || ty < 0 || tx >= W || ty >= H) return;
  if (!walkable(tx, ty, 'owner')) { sfx.nope(); return; }
  sfx.tap(); ripple(tx, ty);
  command(null, exact([tx, ty]));
}
function ripple(x, y) { fx.push({ type: 'tile', wx: x, wy: y, t: 0, dur: .45 }); }
cv.addEventListener('pointerdown', e => { e.preventDefault(); onTap(e); });
$('pay').addEventListener('click', pay);
$('decorBtn').addEventListener('click', () => { audio(); setDecorMode(!decorMode); });
$('decorDone').addEventListener('click', () => setDecorMode(false));
document.querySelectorAll('#decorPanel [data-t]').forEach(b => b.addEventListener('click', () => {
  selType = b.dataset.t;
  document.querySelectorAll('#decorPanel [data-t]').forEach(o => o.setAttribute('aria-pressed', o === b));
}));
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ───────── 갱신 ─────────
function update(dt) {
  elapsed += dt;
  if (toastT > 0) toastT -= dt;
  if (stepChar(owner, dt)) ownerArrive();
  spawnT -= dt;
  if (spawnT <= 0) {
    if (custs.length < MAX_CUST) spawnCustomer();
    spawnT = 5.5 + Math.random() * 3.5;
  }
  for (const c of custs) updateCust(c, dt);
  custs = custs.filter(c => !c.dead);
  for (const c of [owner, ...custs]) if (c.bubble) { c.bubble.t += dt; if (c.bubble.t > c.bubble.dur) c.bubble = null; }
  for (const s of shelves) if (s.flash > 0) s.flash = Math.max(0, s.flash - dt * 1.5);
  for (let i = fx.length - 1; i >= 0; i--) { fx[i].t += dt; if (fx[i].t > fx[i].dur) fx.splice(i, 1); }
}

// ───────── 그리기 ─────────
let lastGuide = '', payShown = false, lastClock = '';
function drawClock(g) {
  const c = BP(5.3, 78);
  g.save(); g.translate(...c); g.transform(1, .5, 0, 1, 0, 0);
  ell(g, 0, 0, 10, 10, '#6b4630'); ell(g, 0, 0, 8.2, 8.2, '#fffaf0');
  const mins = 17 * 60 + elapsed;
  const ma = (mins % 60) / 60 * Math.PI * 2, ha = ((mins / 60) % 12) / 12 * Math.PI * 2;
  g.strokeStyle = '#3a2a20'; g.lineCap = 'round';
  g.lineWidth = 1.6; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.sin(ha) * 4.5, -Math.cos(ha) * 4.5); g.stroke();
  g.lineWidth = 1; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.sin(ma) * 6.5, -Math.cos(ma) * 6.5); g.stroke();
  g.restore();
}
function tileDiamond(g, x, y, fill, stroke, lw) { poly(g, [iso(x, y), iso(x + 1, y), iso(x + 1, y + 1), iso(x, y + 1)], fill, stroke, lw); }
function draw() {
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  g.drawImage(bg, 0, 0);
  g.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  drawClock(g);
  const tm = elapsed;
  // 바닥 위 표시
  if (decorMode) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (decorAt(x, y)) { tileDiamond(g, x, y, 'rgba(240,120,60,.18)', 'rgba(240,120,60,.7)', 1.2); continue; }
      if (!canPlace(x, y)) tileDiamond(g, x, y, 'rgba(90,200,120,.14)', 'rgba(90,200,120,.45)', 1);
    }
    if (!routes) routes = computeRoutes();
    g.save(); g.setLineDash([3, 5]); g.lineDashOffset = -tm * 18; g.lineWidth = 2.2; g.strokeStyle = 'rgba(60,110,200,.75)'; g.lineJoin = 'round';
    for (const r of routes) { g.beginPath(); r.forEach((t, i) => { const p = iso(t[0] + .5, t[1] + .5); i ? g.lineTo(...p) : g.moveTo(...p); }); g.stroke(); }
    g.restore();
  } else if (owner.path.length) {
    const t = owner.path[owner.path.length - 1];
    g.save(); g.globalAlpha = .55 + .25 * Math.sin(tm * 8); tileDiamond(g, t[0], t[1], 'rgba(255,255,255,.18)', '#fff', 1.4); g.restore();
  }
  for (const f of fx) if (f.type === 'tile' && f.t >= 0) {
    const k = f.t / f.dur; g.save(); g.globalAlpha = 1 - k;
    g.translate(...iso(f.wx + .5, f.wy + .5)); g.scale(1 + k * .4, 1 + k * .4); g.translate(...iso(-f.wx - .5, -f.wy - .5));
    tileDiamond(g, f.wx, f.wy, null, '#fff', 2); g.restore();
  }
  // 깊이 정렬
  const list = [];
  shelves.forEach(s => s.tiles.forEach((t, i) => list.push({ d: t[0] + t[1], x: t[0], fn: () => drawShelfUnit(g, s, i) })));
  COUNTER.forEach((t, i) => list.push({ d: t[0] + t[1], x: t[0], fn: () => drawCounterUnit(g, i) }));
  list.push({ d: PILE[0] + PILE[1], x: PILE[0], fn: () => drawPile(g) });
  decor.forEach(d => list.push({ d: d.x + d.y, x: d.x, fn: () => drawDecor(g, d) }));
  for (const c of [owner, ...custs]) list.push({ d: Math.ceil(c.x + c.y - 1e-6) + .5, x: c.x, fn: () => drawPerson(g, c, tm) });
  list.sort((a, b) => a.d - b.d || a.x - b.x);
  for (const it of list) it.fn();
  drawLampGlow(g);
  for (const f of fx) if (f.type === 'ring' && f.t >= 0) {
    const k = f.t / f.dur, p = iso(f.wx, f.wy);
    g.save(); g.globalAlpha = 1 - k; g.strokeStyle = '#ffe08a'; g.lineWidth = 2.5;
    g.beginPath(); g.ellipse(p[0], p[1], 10 + k * 26, 5 + k * 13, 0, 0, Math.PI * 2); g.stroke(); g.restore();
  }
  // 화면 공간: 말풍선·효과·화살표
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gd = guide();
  if (gd.target && !decorMode) {
    const [sx, sy] = toScreen(gd.target[0], gd.target[1] - gd.target[2]);
    const b = Math.sin(tm * 6) * 4;
    poly(g, [[sx - 10, sy - 18 + b], [sx + 10, sy - 18 + b], [sx, sy - 4 + b]], '#ff8a3d', '#fff', 2.5);
  }
  for (const c of [owner, ...custs]) if (c.bubble && c.alpha > .3) drawBubble(g, c);
  for (const f of fx) {
    if (f.t < 0) continue;
    const k = f.t / f.dur;
    const [sx, sy] = toScreen(...iso(f.wx, f.wy));
    if (f.type === 'money') {
      const y = sy - 70 * sc - k * 40;
      g.save(); g.globalAlpha = k > .7 ? (1 - k) / .3 : 1;
      g.font = '18px Jua, sans-serif'; g.textAlign = 'center'; g.lineWidth = 4; g.strokeStyle = '#fff';
      g.strokeText(f.text, sx, y); g.fillStyle = '#1f8a4f'; g.fillText(f.text, sx, y); g.restore();
    } else if (f.type === 'heart') {
      g.save(); g.globalAlpha = 1 - k; g.font = '15px sans-serif'; g.textAlign = 'center'; g.fillStyle = '#ff5a7a';
      g.fillText('♥', sx + f.dx * (1 + k), sy - 60 * sc - k * 34); g.restore();
    }
  }
  // HUD
  if (gd.text !== lastGuide) {
    lastGuide = gd.text; const el = $('guide'); el.textContent = gd.text;
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  const cp = canPay();
  if (cp !== payShown) { payShown = cp; $('pay').classList.toggle('show', cp); }
  if (cp) { const amt = won(queue[0].item ? queue[0].item.price : 0); if ($('payAmt').textContent !== amt) $('payAmt').textContent = amt; }
  const mins = 17 * 60 + Math.floor(elapsed);
  const clk = String(Math.floor(mins / 60) % 24).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
  if (clk !== lastClock) { lastClock = clk; $('clock').innerHTML = '<b>시각</b>' + clk; }
}
function drawBubble(g, c) {
  const b = c.bubble;
  const [px, py] = iso(c.x + .5, c.y + .5);
  const [sx, sy0] = toScreen(px, py - (c.carrying ? 72 : 58));
  const pop = Math.min(1, b.t * 9), fade = b.dur - b.t < .25 ? (b.dur - b.t) / .25 : 1;
  const s = .6 + .4 * (1 - Math.pow(1 - pop, 3));
  g.save(); g.globalAlpha = fade * c.alpha;
  g.translate(sx, sy0); g.scale(s, s);
  const think = b.kind === 'think';
  g.font = (think ? 13 : 15) + 'px Jua, sans-serif';
  const w = g.measureText(b.text).width + 18, h = think ? 22 : 26;
  const bx = clamp(-w / 2, -sx + 6 - 0, vw - sx - w - 6);
  rr(g, bx, -h - 8, w, h, h / 2);
  g.fillStyle = think ? 'rgba(255,255,255,.88)' : '#fffaf2'; g.fill();
  g.lineWidth = 1.6; g.strokeStyle = '#3a2a20'; g.stroke();
  if (think) { ell(g, 0, -3, 2.6, 2.6, '#fff'); g.stroke(); }
  else {
    g.beginPath(); g.moveTo(-5, -9); g.lineTo(0, 0); g.lineTo(5, -9); g.fillStyle = '#fffaf2'; g.fill();
    g.beginPath(); g.moveTo(-5, -8.2); g.lineTo(0, 0); g.lineTo(5, -8.2); g.stroke();
  }
  g.fillStyle = '#3a2a20'; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(b.text, bx + 9, -8 - h / 2 + 1);
  g.restore();
}

// ───────── 루프 ─────────
let last = performance.now(), fpsN = 0, fpsT = 0, fps = 0;
const dbg = $('dbg'); if (DEBUG) dbg.hidden = false;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  if (DEBUG) {
    fpsN++; fpsT += dt;
    if (fpsT >= .5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0;
      dbg.textContent = `${fps} fps · ${cv.width}×${cv.height} (dpr ${dpr}) · 손님 ${custs.length}`; }
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 120));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { renderBg(); });
fit();
requestAnimationFrame(frame);

// 자동 확인용(사람 조작과 무관)
window.__shop = {
  screenOf: (gx, gy, h = 0) => { const p = iso(gx, gy); return toScreen(p[0], p[1] - h); },
  state: () => ({ money, carrying: owner.carrying, owner: [owner.x, owner.y], stock: shelves.map(s => s.stock),
    queue: queue.length, custs: custs.map(c => c.state), decor: decor.length, canPay: canPay(), guide: lastGuide }),
};
})();
</script>
